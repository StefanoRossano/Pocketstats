plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stefanorossano.pockettracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stefanorossano.pockettracker'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2'
    }

    // Chiave di firma debug FISSA (commitata nel repo, in keystore/debug.keystore).
    // Senza questo, ogni build su GitHub Actions genererebbe una chiave debug diversa
    // (macchina nuova ogni volta), rendendo impossibile aggiornare l'app senza disinstallarla
    // prima (con perdita dei dati locali). Con una chiave fissa, gli aggiornamenti futuri
    // si installano sopra la versione precedente senza problemi.
    //
    // La chiave RELEASE invece non va MAI committata (repo pubblico!): viene scritta dal
    // workflow CI a partire da un secret di GitHub Actions, in un file che esiste solo
    // temporaneamente durante la build (vedi .github/workflows/build.yml).
    signingConfigs {
        debug {
            storeFile file("../keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            storeFile file("../release.keystore")
            storePassword System.getenv("RELEASE_STORE_PASSWORD")
            keyAlias System.getenv("RELEASE_KEY_ALIAS")
            keyPassword System.getenv("RELEASE_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
}
